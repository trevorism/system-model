[project]
name = "system-model"
version = "0.1.0"
description = "A hierarchical model that sits as a peer to a software system: derive current state from code, and (later) author specs that constrain agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
systemmodel = "systemmodel.derive:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["systemmodel"]
